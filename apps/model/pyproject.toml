[project]
name = "site-needle"
version = "0.1.0"
description = "Fine-tunes Needle 2, a 14MB tool-calling model, into an intent router for alexnodeland.com — with the corpus, training, evaluation and release tooling around it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Inference and the training entry points. JAX and friends sit behind the
  # `train` extra, so the corpus and evaluation commands install in seconds.
  "cactus-needle>=2.0.13,<2.1",
  "huggingface_hub>=0.25",
  "pydantic>=2.7",
  # Needle's tokenizer, so the corpus build counts real tokens without JAX.
  "sentencepiece>=0.2",
]

[project.optional-dependencies]
train = ["cactus-needle[train]"]
gpu = ["cactus-needle[gpu]"]
# Apple GPU: Needle's metal extra pins JAX 0.4.38 for the jax-metal plugin,
# and flax and optax have to be old enough to import against it. This
# extra conflicts with `train` (declared below), so one lockfile carries
# both resolutions: `--extra train` on Linux, `--extra metal` on a Mac.
metal = ["cactus-needle[metal]", "flax==0.10.2", "optax==0.2.4"]
tracking = ["mlflow>=2.15"]
dev = ["pytest>=8", "ruff>=0.6"]
augment = [
    "anthropic>=1.0",
    "claude-agent-sdk>=0.2",
]
analysis = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.scripts]
site-needle = "site_needle.cli:main"

[tool.uv]
conflicts = [[{ extra = "train" }, { extra = "metal" }], [{ extra = "gpu" }, { extra = "metal" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["site_needle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs the native Needle engine (downloaded on first use)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
