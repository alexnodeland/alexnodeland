name: Test Suite

# The site is one app in a monorepo, so the model app's churn does not run the
# site's tests. Two directories under the site are excluded as well: `docs/` is
# written for people and `archive/` is local reference copies that Gatsby never
# sources, so neither can change what the suites below assert. Blog markdown is
# deliberately *not* excluded: a post is content the e2e suite renders, and a
# malformed one should fail here rather than in production.
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - '.github/workflows/test.yml'
      - '!apps/web/docs/**'
      - '!apps/web/archive/**'
      - '!apps/web/*.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - '.github/workflows/test.yml'
      - '!apps/web/docs/**'
      - '!apps/web/archive/**'
      - '!apps/web/*.md'

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here comments on PRs or writes checks — reading the repo is the
# whole job.
permissions:
  contents: read

# The site is one app in a monorepo; every `run` step executes inside it.
# Action inputs that take paths (the caches, the artifact) are relative to the
# repository root instead, and spell the prefix out.
defaults:
  run:
    working-directory: apps/web

jobs:
  # Which of the two suites a change can actually reach. The e2e suite renders
  # the real site, so everything that ships matters to it and it always runs.
  # tsc, eslint and jest only ever read code: eslint globs .ts/.tsx/.js/.jsx,
  # tsc has no opinion on markdown, and jest excludes `src/content` from
  # coverage outright. A blog post or an image has nothing to say to them, and
  # on a content-only change the whole job is skipped rather than spending two
  # minutes proving it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The filter diffs against the base commit, which a shallow clone
          # does not have on a push event.
          fetch-depth: 0

      - name: Sort the changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Load-bearing, not a default worth leaving alone. Under 'some', a
          # file counts if it matches any one rule -- and a negated rule matches
          # everything it does not name, so both exclusions below were inert and
          # `code` came out true for every change under apps/web, a lone blog
          # post included. This quantifier is what makes them subtract.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - 'apps/web/**'
              - '!apps/web/src/content/**'
              - '!apps/web/static/images/**'
              - '.github/workflows/test.yml'

  test:
    name: Run Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # One version, the active LTS, matching the deploy workflow. This is a
      # site shipped from a single runtime, not a library supporting a range —
      # the old 18/20/22 matrix tripled every run to test platforms nothing
      # deploys on (and 18 and 20 are both past end-of-life).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # --prefer-offline reads the setup-node cache instead of refetching what
      # it already has; the audit and funding passes are network round trips
      # whose output nothing here reads.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      # `jest --coverage` runs every suite in the repo — unit today, and any
      # integration directory the moment it returns — so there is no separate
      # integration step to keep alive or double-run.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/web/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Transformers.js otherwise caches inside its own installed package,
      # which `npm ci` deletes. See scripts/lib/transformers-env.mjs.
      HF_TRANSFORMERS_CACHE: ${{ github.workspace }}/apps/web/.hf-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # --prefer-offline reads the setup-node cache instead of refetching what
      # it already has; the audit and funding passes are network round trips
      # whose output nothing here reads.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # The embedding model the chat index is built with: ~34MB fetched from
      # Hugging Face, who rate-limit. Uncached, a 429 fails `build:index`,
      # which fails `npm run develop`, which fails the webServer below before
      # a single spec has run, a red suite that says nothing about the site.
      # Keyed on what decides which files are fetched: the model id lives in
      # the config, the dtype in the build script.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: apps/web/.hf-cache
          key: hf-${{ hashFiles('apps/web/src/config/retrieval.mjs', 'apps/web/scripts/build-chat-index.mjs') }}
          restore-keys: hf-

      # Chromium is ~150MB per run otherwise. Keyed on the resolved Playwright
      # version rather than the lockfile, which moves every time any dependency
      # does while the browser build does not.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # One browser download covers both projects below — Desktop Chrome and
      # Mobile Chrome are the same chromium under two viewports. Firefox and
      # WebKit stay local-only: their installs cost more than the coverage
      # they add to a site this size. The browser may come from the cache
      # above; the system libraries `--with-deps` installs never do.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The config starts `npm run develop` itself (see webServer in
      # playwright.config.ts) — the dev server is what the specs were written
      # against.
      - name: Run e2e tests
        run: npx playwright test --project=chromium --project="Mobile Chrome"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
