name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here comments on PRs or writes checks — reading the repo is the
# whole job.
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # One version, the active LTS, matching the deploy workflow. This is a
      # site shipped from a single runtime, not a library supporting a range —
      # the old 18/20/22 matrix tripled every run to test platforms nothing
      # deploys on (and 18 and 20 are both past end-of-life).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      # `jest --coverage` runs every suite in the repo — unit today, and any
      # integration directory the moment it returns — so there is no separate
      # integration step to keep alive or double-run.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One browser download covers both projects below — Desktop Chrome and
      # Mobile Chrome are the same chromium under two viewports. Firefox and
      # WebKit stay local-only: their installs cost more than the coverage
      # they add to a site this size.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The config starts `npm run develop` itself (see webServer in
      # playwright.config.ts) — the dev server is what the specs were written
      # against.
      - name: Run e2e tests
        run: npx playwright test --project=chromium --project="Mobile Chrome"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
