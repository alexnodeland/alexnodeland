name: Site model status

# Is the published model current with the site's content? Weekly and on
# demand: export the content, rebuild the corpus, compare it with the
# manifest the published model carries (models/site-needle.json names the
# revision on the Hub). When it is stale, one issue labelled `model-stale`
# says what changed and how to retrain; when it is current again, the
# issue is closed. This never trains: a run is about an hour on a Mac and
# about four on a hosted runner, so training is a decision — `just model pipeline`
# locally, or the "Train site model" workflow on demand.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-model-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the site
        working-directory: apps/web
        run: npm ci

      - name: Export the site's content
        working-directory: apps/web
        run: npm run build:content

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/model/uv.lock

      - name: Install the model app
        working-directory: apps/model
        run: uv sync --frozen --extra dev --extra analysis

      - name: Build the corpus
        working-directory: apps/model
        run: uv run site-needle corpus build

      - name: Is the published model current?
        id: status
        working-directory: apps/model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          uv run site-needle corpus status | tee status.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo '## Published model'
            echo
            echo '```'
            cat status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Open, update or close the staleness issue
        uses: actions/github-script@v9
        env:
          STATUS_CODE: ${{ steps.status.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const stale = process.env.STATUS_CODE === '3';
            const label = 'model-stale';
            const title = 'The site model is stale';
            const status = fs.readFileSync('apps/model/status.txt', 'utf8').trim();
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 5,
            })).data.filter(i => i.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (!stale) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `The published model is current again ([status run](${runUrl})).\n\n\`\`\`\n${status}\n\`\`\``,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const body = [
              'The site\'s content has changed since the published model was trained ' +
              `([status run](${runUrl})). \`site-needle corpus status\` says:`,
              '',
              '```',
              status,
              '```',
              '',
              'To retrain, locally (about an hour on an Apple Silicon laptop, about four on a hosted runner):',
              '',
              '```sh',
              'just model augment            # or: just corpus, for templates only',
              'just model pipeline --promote  # train, grade, gate, publish to the Hub, move the pointer',
              '```',
              '',
              'then open a pull request with `apps/model/models/site-needle.json`. Or dispatch the ' +
              '"Train site model" workflow, which does the same on a hosted runner and opens that pull request itself.',
              '',
              'This issue is kept up to date by the weekly status workflow and closed when the model is current.',
            ].join('\n');
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'The published site model was trained on older content',
              });
            }
            if (open.length) {
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
