name: Train site model

# On demand only. Training is a decision: a run is minutes on a Mac with
# Needle's metal extra and a few hours on a hosted runner's CPU, so the
# schedule (`model-status.yml`) only reports staleness, and this workflow is
# for when no machine is at hand. It exports the content, rebuilds the
# corpus (with LLM paraphrases when an ANTHROPIC_API_KEY secret exists),
# trains, grades every epoch, gates, publishes the run and the corpus to the
# Hugging Face Hub (HF_TOKEN secret), and opens a pull request that moves
# models/site-needle.json to the new revision.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Epochs (blank = config.toml)'
        required: false
        default: ''
      augment:
        description: 'LLM paraphrase budget (0 = templates only; needs ANTHROPIC_API_KEY)'
        required: false
        default: '1600'
      force:
        description: 'Train even if the published model is current'
        type: boolean
        default: false
      promote:
        description: 'On a passing gate, publish to the Hub and open the pointer pull request'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: train-site-model
  cancel-in-progress: false

env:
  # Needle's anonymous telemetry is off in CI by its own rule; be explicit.
  NEEDLE_TELEMETRY: '0'
  # MLflow's local store is pointless on a runner; the run directory is the record.
  SITE_NEEDLE_NO_TRACKING: '1'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the site
        working-directory: apps/web
        run: npm ci

      - name: Export the site's content
        working-directory: apps/web
        run: npm run build:content

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/model/uv.lock

      - name: Install the model app with the training stack
        working-directory: apps/model
        run: uv sync --frozen --extra train --extra analysis --extra augment --extra dev

      # The 90MB base checkpoint, the tokenizer, and the native engine. Keyed
      # on the lockfile because the engine version follows the package.
      - name: Restore the base model and engine
        uses: actions/cache@v4
        with:
          path: |
            apps/model/checkpoints
            ~/.cache/cactus-needle
            ~/.cache/huggingface
          key: needle-base-${{ hashFiles('apps/model/uv.lock') }}

      - name: Build the corpus
        working-directory: apps/model
        run: uv run site-needle corpus build

      - name: Is the published model current?
        id: status
        working-directory: apps/model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          uv run site-needle corpus status | tee status.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo '## Published model'
            echo
            echo '```'
            cat status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Nothing to do
        if: steps.status.outputs.code == '0' && inputs.force != true
        run: echo "The published model is current with the site's content; not training (dispatch with force to train anyway)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the run
        if: steps.status.outputs.code != '0' || inputs.force == true
        run: echo "RUN_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # With an ANTHROPIC_API_KEY secret and a budget, the corpus also gets
      # LLM-written paraphrases: the kept generations come from the dataset
      # repo when the content is unchanged, so only what is new is asked for.
      # A passing gate with `promote` publishes the run and the corpus to the
      # Hub and moves models/site-needle.json; the pull request below carries
      # that one file.
      - name: Train, grade every epoch, gate, publish
        id: pipeline
        if: env.RUN_ID != ''
        working-directory: apps/model
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          augment=""
          if [ -n "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.augment }}" != "0" ]; then
            augment="--augment ${{ inputs.augment }} --natural 150 --provider anthropic"
          fi
          promote=""
          if [ "${{ inputs.promote }}" != "false" ]; then promote="--promote"; fi
          uv run site-needle pipeline --run-id "$RUN_ID" --no-tracking $promote $augment \
            ${{ inputs.epochs != '' && format('--epochs {0}', inputs.epochs) || '' }}

      - name: Summarise
        if: env.RUN_ID != ''
        working-directory: apps/model
        run: |
          if [ -f "runs/$RUN_ID/report.md" ]; then
            cat "runs/$RUN_ID/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The run produced no report; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything the run wrote, whether or not it passed: every epoch's
      # adapter and grades, the export, both evaluations, the curve. Thirty
      # days is enough to compare against the next one.
      - name: Upload the run
        if: env.RUN_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ env.RUN_ID }}
          path: apps/model/runs/${{ env.RUN_ID }}
          retention-days: 30

      # Promoting a model to the site is a decision, and the report is in
      # the pull request body: the pointer moves by review, never by push.
      - name: Propose the new pointer
        if: env.RUN_ID != '' && steps.pipeline.outcome == 'success' && inputs.promote != false
        uses: peter-evans/create-pull-request@v7
        with:
          branch: model/run-${{ env.RUN_ID }}
          title: 'Promote site model ${{ env.RUN_ID }}'
          commit-message: 'Promote site model ${{ env.RUN_ID }}'
          body-path: apps/model/runs/${{ env.RUN_ID }}/model-card.md
          add-paths: apps/model/models/site-needle.json
          labels: model

      - name: Fail the job if the gate failed
        if: env.RUN_ID != '' && steps.pipeline.outcome != 'success'
        run: |
          echo "The pipeline did not pass its gate; see the report above." >&2
          exit 1
