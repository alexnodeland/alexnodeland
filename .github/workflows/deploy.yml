# Sample workflow for building and deploying a Gatsby site to GitHub Pages
#
# To get started with Gatsby see: https://www.gatsbyjs.com/docs/quick-start/
#
name: Deploy Gatsby site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Only .cache is restored, never public. Restoring a previous public/
      # lets Gatsby keep a stale index.html that references an old
      # styles.<hash>.css while writing the new stylesheet beside it,
      # unreferenced — a CSS-only change then deploys with no visible effect
      # and a green build. Reproduced locally; see the subtitle-halo commit.
      # .cache holds the expensive work (transforms, image processing) and is
      # keyed on lockfile + source so it invalidates correctly on its own.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-gatsby-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'gatsby-*.ts', 'gatsby-*.js') }}
          restore-keys: |
            ${{ runner.os }}-gatsby-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-gatsby-build-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # `npm run build` runs scripts/build-cv.js, which typesets the CV PDFs
      # into static/cv/ before Gatsby copies static/ into the bundle. These
      # three packages cover what templates/cv/resume.tex.js uses (geometry,
      # titlesec, enumitem, hyperref, xcolor, microtype, charter) without
      # pulling the whole of TeX Live. Without them the build still succeeds,
      # but /cv/*.pdf ships as a 404.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Build with Gatsby
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
