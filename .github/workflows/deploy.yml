name: Deploy Gatsby site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Nightly, so the activity panel's contribution graph tracks the profile
  # rather than the last push to this repo.
  schedule:
    - cron: '17 5 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm, plainly — package-lock.json is committed. The sample workflow's
      # yarn-detection dance guarded a choice this repo made long ago.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Only .cache is restored, never public. Restoring a previous public/
      # lets Gatsby keep a stale index.html that references an old
      # styles.<hash>.css while writing the new stylesheet beside it,
      # unreferenced — a CSS-only change then deploys with no visible effect
      # and a green build. Reproduced locally; see the subtitle-halo commit.
      # .cache holds the expensive work (transforms, image processing) and is
      # keyed on lockfile + source so it invalidates correctly on its own.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-gatsby-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'gatsby-*.ts', 'gatsby-*.js') }}
          restore-keys: |
            ${{ runner.os }}-gatsby-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-gatsby-build-

      - name: Install dependencies
        run: npm ci

      # The typeset CV PDFs, keyed on exactly their inputs. On a hit the
      # LaTeX toolchain is never installed: scripts/build-cv.js warns that
      # pdflatex is missing and exits 0, leaving these cached PDFs in
      # static/cv for Gatsby to ship — installing TeX Live was the longest
      # step in the build, spent re-typesetting an unchanged CV. No
      # restore-keys on purpose: a partial match would silently ship stale
      # PDFs, so anything short of exact rebuilds them.
      - name: Restore CV PDFs
        id: cv-pdfs
        uses: actions/cache@v4
        with:
          path: static/cv
          key: ${{ runner.os }}-cv-pdfs-${{ hashFiles('src/config/cv.ts', 'templates/cv/**', 'scripts/build-cv.js') }}

      # These packages cover what templates/cv/resume.tex.js uses (geometry,
      # titlesec, enumitem, hyperref, xcolor, microtype, charter) without
      # pulling the whole of TeX Live. Without them the build still succeeds,
      # but /cv/*.pdf ships as a 404.
      - name: Install LaTeX
        if: steps.cv-pdfs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      # The only step either token is exposed to, and it runs exactly one
      # script. `npm run build` below drives Gatsby, its plugins, the chat
      # indexer and the CV typesetter — every one of them, and everything in
      # their dependency trees, can read whatever is in that step's
      # environment. A credential that grants read access to private source
      # has no business sitting there for the length of a full site build, so
      # it lives and dies here instead.
      #
      # ACTIVITY_TOKEN is an optional read-only fine-grained PAT (a repository
      # secret, never shipped — only the aggregated JSON reaches the site); it
      # is what folds private repos into the counts. Without it the Actions
      # token still refreshes the calendar and the public-repo numbers.
      - name: Fetch GitHub activity
        run: npm run build:activity
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      # No token here on purpose. `npm run build` re-runs build:activity as
      # part of its chain, finds no credential, and keeps the snapshot the
      # step above just wrote — so the guard that protects credential-less
      # builds is also what makes this scoping work, with no second code path.
      - name: Build with Gatsby
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
