# Weekly dependency updates, grouped so routine bumps arrive as one PR
# rather than one per package. Majors stay separate: they are the ones
# that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Jest's packages move in lockstep: a major bump of one alone fails
      # (#120, #121, #122 came apart), so they arrive as one PR.
      jest:
        patterns:
          - jest
          - babel-jest
          - jest-environment-*
          - '@types/jest'
        update-types:
          - major
    # Majors Gatsby 5 cannot take. Its router (@gatsbyjs/reach-router) and
    # react-helmet pin React 18, and it compiles with Babel 7, so these
    # bumps fail `npm ci` with ERESOLVE (#88, #90, #91). Gatsby 5.16.1 is the
    # latest stable; React 19 exists only as a prerelease tag. Lift these when
    # a stable Gatsby supports React 19 and Babel 8.
    ignore:
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      # eslint 10 drops .eslintrc for flat config, and Gatsby's bundled
      # eslint-config-react-app does not accept it: `npm ci` fails (#118).
      # Moving to eslint 9 and flat config is its own change.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 accepts TypeScript <6.1, so 7 fails `npm ci` (#123).
      # Only 7 and later are held: a TypeScript 6 bump can still arrive.
      - dependency-name: typescript
        versions: ['>=7']
    labels:
      - dependencies

  # The model app is a uv project; its lockfile is apps/model/uv.lock. The
  # training stack (jax, flax, cactus-needle) moves fast and a bump can
  # change numerics, so majors arrive alone here too.
  - package-ecosystem: uv
    directory: /apps/model
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
